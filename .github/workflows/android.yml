name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'
  JAVA_VERSION: '17'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore Android project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android
          tar -xJf ci/android-full.tar.xz
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/gradlew

      - name: Restore verified Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/bootstrap_gradle_wrapper.sh
          bash scripts/bootstrap_gradle_wrapper.sh
          chmod +x android/gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Nemr-Language-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
