name: Android Full Native Release

on:
  push:
    branches: [full-native-build, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'
  COMPILE_SDK: '36'
  BUILD_TOOLS: '36.0.0'
  NDK_VERSION: '28.2.13676358'

jobs:
  full-native-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout complete repository
        uses: actions/checkout@v5

      - name: Verify committed Android project and native wiring
        shell: bash
        run: |
          set -euo pipefail
          test -s android/settings.gradle.kts
          test -s android/app/build.gradle.kts
          test -s android/gradlew
          test -s android/gradlew.bat
          test -s android/gradle/wrapper/gradle-wrapper.properties
          NATIVE=android/app/src/main/kotlin/com/elnemr/language
          for f in \
            MainActivity.kt AudioExtractor.kt SpeechCoach.kt MediaProbe.kt FileBrowser.kt \
            WebDAVClient.kt SMBClient.kt FtpClient.kt ExoPlayerView.kt PlaybackService.kt \
            DownloadClient.kt MediaScanner.kt PipManager.kt; do
            test -s "$NATIVE/$f"
          done
          grep -q 'AudioExtractor(this).configure' "$NATIVE/MainActivity.kt"
          grep -q 'SpeechCoach(this).configure' "$NATIVE/MainActivity.kt"
          grep -q 'MediaProbe(this).configure' "$NATIVE/MainActivity.kt"
          grep -q 'elnemr/audio_extractor' "$NATIVE/AudioExtractor.kt"
          grep -q 'createOnDeviceSpeechRecognizer' "$NATIVE/SpeechCoach.kt"
          grep -q 'EXTRA_PREFER_OFFLINE' "$NATIVE/SpeechCoach.kt"
          grep -q 'android.permission.RECORD_AUDIO' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.READ_MEDIA_VIDEO' android/app/src/main/AndroidManifest.xml
          grep -q 'applicationId = "com.elnemr.language"' android/app/build.gradle.kts
          grep -q 'minSdk = 26' android/app/build.gradle.kts
          grep -q 'compileSdk = 36' android/app/build.gradle.kts
          grep -q 'ndkVersion = "28.2.13676358"' android/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Install required Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platforms;android-${COMPILE_SDK}" \
            "build-tools;${BUILD_TOOLS}" \
            "ndk;${NDK_VERSION}"

      - name: Generate installable release signing key
        shell: bash
        run: |
          set -euo pipefail
          PASS="$(openssl rand -hex 18)"
          KEYSTORE="$RUNNER_TEMP/elnemr-ci-release.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" \
            -alias elnemr-ci -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=El-Nemr Language CI,O=El-Nemr Language,C=EG'
          {
            echo "ELNEMR_KEYSTORE_PATH=$KEYSTORE"
            echo "ELNEMR_KEYSTORE_PASSWORD=$PASS"
            echo "ELNEMR_KEY_ALIAS=elnemr-ci"
            echo "ELNEMR_KEY_PASSWORD=$PASS"
          } >> "$GITHUB_ENV"

      - name: Resolve dependencies
        run: flutter pub get

      - name: Audit resolved critical dependencies
        run: python3 scripts/resolved_dependency_audit.py

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Flutter tests
        run: flutter test --no-pub

      - name: Build full native APK
        run: flutter build apk --release --no-pub

      - name: Build full native AAB
        run: flutter build appbundle --release --no-pub

      - name: Verify signed release artifacts and Android identity
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK"
          test -s "$AAB"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.elnemr.language'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "application-label:'El-Nemr Language'" "$RUNNER_TEMP/apk-badging.txt"
          unzip -tq "$APK"
          ls -lh "$APK" "$AAB"
          sha256sum "$APK" "$AAB" | tee release-sha256.txt

      - name: Upload full native APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Nemr-Language-FULL-NATIVE-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            release-sha256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload full native AAB
        uses: actions/upload-artifact@v4
        with:
          name: El-Nemr-Language-FULL-NATIVE-AAB
          path: |
            build/app/outputs/bundle/release/app-release.aab
            release-sha256.txt
          if-no-files-found: error
          retention-days: 30
