name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.44.9'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Generate Android platform
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android "$RUNNER_TEMP/elnemr_android_scaffold"
          flutter create \
            --platforms=android \
            --org com.elnemr \
            --project-name language \
            "$RUNNER_TEMP/elnemr_android_scaffold"
          cp -a "$RUNNER_TEMP/elnemr_android_scaffold/android" ./android
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('android:label="language"', 'android:label="El-Nemr Language"')
          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
          perms = '''\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'''
          s = s.replace(marker, marker + perms)
          p.write_text(s)
          PY
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          grep -R "com.elnemr.language" -n android/app | head

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Build APK
        run: flutter build apk --release --no-pub

      - name: Verify APK exists
        shell: bash
        run: |
          set -euo pipefail
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: El-Nemr-Language-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
